<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#0E1F1A"/>
      <stop offset="100%" stop-color="#12261F"/>
    </linearGradient>
    <linearGradient id="topAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D9E6F"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>
    <pattern id="dotGrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2D9E6F" opacity="0.10"/>
    </pattern>
    <clipPath id="roundedCorners">
      <rect x="0" y="0" width="1200" height="300" rx="26" ry="26"/>
    </clipPath>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap');
      .label { font-family: 'Poppins', sans-serif; }
      .code  { font-family: 'JetBrains Mono', 'Courier New', monospace; }
    </style>
  </defs>

  <g clip-path="url(#roundedCorners)">
    <rect width="1200" height="300" fill="url(#bgGrad)"/>
    <rect width="1200" height="300" fill="url(#dotGrid)"/>
    <rect width="1200" height="4" fill="url(#topAccent)"/>
  </g>

  <text x="64" y="54" class="label" font-size="13" font-weight="600" fill="#2D9E6F" letter-spacing="3">FULLSTACK &amp; MOBILE DEVELOPMENT</text>

  <path d="M246,158 L574,158" stroke="#2D9E6F" stroke-width="2" stroke-dasharray="5 5" opacity="0.5" fill="none"/>
  <path d="M626,158 L954,158" stroke="#2D9E6F" stroke-width="2" stroke-dasharray="5 5" opacity="0.5" fill="none"/>

  <circle r="4" fill="#6EE7B7" filter="url(#softGlow)">
    <animateMotion dur="2.2s" repeatCount="indefinite" path="M246,158 L574,158"/>
  </circle>
  <circle r="4" fill="#6EE7B7" filter="url(#softGlow)">
    <animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite" path="M626,158 L954,158"/>
  </circle>

  <circle cx="220" cy="158" r="30" fill="#0F2420" stroke="#2D9E6F" stroke-width="2"/>
  <text x="220" y="166" text-anchor="middle" class="code" font-size="20" fill="#6EE7B7">{ }</text>
  <text x="220" y="216" text-anchor="middle" class="label" font-size="12" font-weight="600" fill="#8CA3A0" letter-spacing="2">BACKEND</text>

  <circle cx="600" cy="158" r="30" fill="#0F2420" stroke="#2D9E6F" stroke-width="2"/>
  <text x="600" y="165" text-anchor="middle" class="code" font-size="17" fill="#6EE7B7">&lt;/&gt;</text>
  <text x="600" y="216" text-anchor="middle" class="label" font-size="12" font-weight="600" fill="#8CA3A0" letter-spacing="2">FRONTEND</text>

  <circle cx="980" cy="158" r="30" fill="#0F2420" stroke="#2D9E6F" stroke-width="2"/>
  <rect x="969" y="141" width="22" height="34" rx="4" fill="none" stroke="#6EE7B7" stroke-width="1.6"/>
  <circle cx="980" cy="169" r="1.6" fill="#6EE7B7"/>
  <text x="980" y="216" text-anchor="middle" class="label" font-size="12" font-weight="600" fill="#8CA3A0" letter-spacing="2">MOBILE</text>

  <text x="600" y="258" text-anchor="middle" class="label" font-size="15" fill="#94A3B8">Menjembatani Backend -&gt; Frontend -&gt; Mobile Apps</text>
</svg>
